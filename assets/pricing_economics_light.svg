<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="cardShadow4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="featuredShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" fill="url(#bgGrad4)" />

  <!-- Outer Frame -->
  <rect x="30" y="24" width="1140" height="492" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow4)" />

  <!-- Title Header -->
  <g transform="translate(60, 48)">
    <rect width="180" height="26" rx="13" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <text x="14" y="17" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369A1" letter-spacing="0.5">MONETIZATION &amp; PRICING</text>
    <text x="0" y="55" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0F172A">
      Offer Stack Design &amp; Unit Economics Sustainability
    </text>
    <text x="0" y="78" font-family="'Inter', -apple-system, sans-serif" font-size="14" fill="#64748B">
      Developer-first freemium funnel with sustainable lifetime economics (&gt;94.5% gross margin).
    </text>
  </g>

  <!-- Pricing Cards Grid -->
  <g transform="translate(60, 145)">

    <!-- Tier 1: Free -->
    <g transform="translate(0, 0)">
      <rect width="330" height="265" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow4)" />
      <text x="24" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Community Free</text>
      <text x="24" y="54" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#64748B">For solo tinkerers &amp; prototypes</text>
      
      <text x="24" y="98" font-family="'Inter', -apple-system, sans-serif" font-size="36" font-weight="850" fill="#0F172A">$0</text>
      <text x="75" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#64748B">/ month</text>

      <g transform="translate(24, 120)">
        <text x="0" y="16" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#10B981" font-weight="700">✓</tspan>  3 Automated Audits / month</text>
        <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#10B981" font-weight="700">✓</tspan>  Standard OWASP LLM Suite</text>
        <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#10B981" font-weight="700">✓</tspan>  Web Dashboard Access</text>
        <text x="0" y="82" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#10B981" font-weight="700">✓</tspan>  Community Discord Support</text>
        <text x="0" y="104" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#10B981" font-weight="700">✓</tspan>  100% Non-Custodial Scans</text>
      </g>
    </g>

    <!-- Tier 2: Pro (Featured) -->
    <g transform="translate(365, 0)">
      <rect width="350" height="265" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#featuredShadow)" />
      
      <!-- Featured Pill -->
      <rect x="230" y="14" width="105" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="242" y="30" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1D4ED8" letter-spacing="0.5">MOST POPULAR</text>

      <text x="24" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Pro Developer</text>
      <text x="24" y="54" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#64748B">For active startups &amp; teams</text>
      
      <text x="24" y="98" font-family="'Inter', -apple-system, sans-serif" font-size="36" font-weight="850" fill="#0284C7">$39</text>
      <text x="95" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#64748B">/ month</text>

      <g transform="translate(24, 120)">
        <text x="0" y="16" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#0F172A"><tspan fill="#0284C7" font-weight="700">✓</tspan>  <tspan font-weight="700">Unlimited</tspan> Automated Audits</text>
        <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#0F172A"><tspan fill="#0284C7" font-weight="700">✓</tspan>  <tspan font-weight="700">CI/CD Webhooks &amp; GitHub Actions</tspan></text>
        <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#0F172A"><tspan fill="#0284C7" font-weight="700">✓</tspan>  Custom Adversarial Payload Library</text>
        <text x="0" y="82" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#0F172A"><tspan fill="#0284C7" font-weight="700">✓</tspan>  Exportable PDF / JSON Certificates</text>
        <text x="0" y="104" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#0F172A"><tspan fill="#0284C7" font-weight="700">✓</tspan>  Priority Support (&lt;12h response)</text>
      </g>
    </g>

    <!-- Tier 3: Lifetime Founder -->
    <g transform="translate(745, 0)">
      <rect width="335" height="265" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow4)" />
      
      <!-- LTD Pill -->
      <rect x="220" y="14" width="100" height="24" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="232" y="30" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#6D28D9" letter-spacing="0.5">FIRST 100 ONLY</text>

      <text x="24" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Founder Lifetime</text>
      <text x="24" y="54" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#64748B">One-time payment for early backers</text>
      
      <text x="24" y="98" font-family="'Inter', -apple-system, sans-serif" font-size="36" font-weight="850" fill="#6D28D9">$149</text>
      <text x="120" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#64748B">one-time</text>

      <g transform="translate(24, 120)">
        <text x="0" y="16" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#7C3AED" font-weight="700">✓</tspan>  <tspan font-weight="700">All Pro Features Included</tspan></text>
        <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#7C3AED" font-weight="700">✓</tspan>  1 Named Developer Seat</text>
        <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#7C3AED" font-weight="700">✓</tspan>  300 Scans / Month Soft Fair-Use</text>
        <text x="0" y="82" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#7C3AED" font-weight="700">✓</tspan>  Lifetime Core Feature Updates</text>
        <text x="0" y="104" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155"><tspan fill="#7C3AED" font-weight="700">✓</tspan>  Private Founder Roadmap Channel</text>
      </g>
    </g>

  </g>

  <!-- Bottom Unit Economics Callout -->
  <g transform="translate(60, 435)">
    <rect width="1080" height="56" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="24" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">
      FINANCIAL SUSTAINABILITY:
    </text>
    <text x="210" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#334155">
      Blended compute cost: <tspan font-weight="700" fill="#0284C7">&lt; $0.0023 / scan</tspan> • Gross margin: <tspan font-weight="700" fill="#059669">&gt; 94.8%</tspan> • LTV/CAC: <tspan font-weight="700" fill="#6D28D9">19.5 : 1</tspan>
    </text>
    <text x="24" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#64748B">
      At 300 scans/mo max fair-use, a single $149 LTD purchase yields 209 months (17+ years) of funded compute runway.
    </text>
  </g>
</svg>
